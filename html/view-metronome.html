<!-- ============ VIEW: 메트로놈 ============ -->
<!-- #view-metronome (index.html) 안에 주입됩니다. js/partials.js 참고 -->

<div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- Left: Tempo control -->
    <div class="lg:col-span-7 bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-5 sm:p-6 shadow-xl">
        <h2 class="text-xl font-bold mb-1 text-zinc-100 flex items-center gap-2">
            <i class="fa-solid fa-stopwatch text-amber-500"></i> 메트로놈
        </h2>
        <p class="hidden sm:block text-xs text-zinc-400 mb-5">느린 템포에서 정확하게 짚는 연습부터 시작해 조금씩 올리세요.</p>

        <!-- Drag anywhere on this panel to change tempo -->
        <div id="met-slide-track" class="met-slide relative rounded-2xl border border-zinc-800 bg-zinc-950 px-6 py-7 cursor-grab shadow-inner">
            <div class="text-center">
                <div id="met-bpm" class="text-7xl sm:text-8xl font-black text-zinc-100 leading-none tracking-tighter">100</div>
                <div class="text-xs font-bold text-zinc-500 mt-2 uppercase tracking-widest">
                    BPM · <span id="met-tempo-name" class="text-amber-400">Andante</span>
                </div>
                <p class="hidden sm:flex text-[11px] text-zinc-500 mt-3 items-center justify-center gap-1.5">
                    <i class="fa-solid fa-arrows-left-right text-amber-500/70"></i>
                    좌우로 드래그하거나 <kbd class="px-1 py-0.5 bg-zinc-800 border border-zinc-700 rounded text-[10px]">←</kbd>
                    <kbd class="px-1 py-0.5 bg-zinc-800 border border-zinc-700 rounded text-[10px]">→</kbd> 키로 조절
                </p>
            </div>

            <div class="mt-5 h-1.5 bg-zinc-800 rounded-full overflow-hidden">
                <div id="met-range-fill" class="h-full bg-gradient-to-r from-amber-500 to-orange-500 transition-all duration-75" style="width: 26%"></div>
            </div>
            <div class="flex justify-between text-[10px] text-zinc-600 font-mono mt-1">
                <span>30</span><span>300</span>
            </div>
        </div>

        <!-- Fine adjust -->
        <div class="grid grid-cols-4 gap-2 mt-4">
            <button id="met-minus-10" class="py-2.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-200 text-xs font-bold transition">−10</button>
            <button id="met-minus" class="py-2.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-200 text-xs font-bold transition">−1</button>
            <button id="met-plus" class="py-2.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-200 text-xs font-bold transition">+1</button>
            <button id="met-plus-10" class="py-2.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-200 text-xs font-bold transition">+10</button>
        </div>

        <!-- Beat indicator -->
        <div id="met-beat-dots" class="flex items-center justify-center gap-3 h-12 mt-4"></div>

        <button id="met-toggle" class="w-full py-4 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-zinc-950 font-black text-base shadow-lg shadow-amber-500/20 active:scale-[0.99] transition flex items-center justify-center gap-2">
            <i id="met-toggle-icon" class="fa-solid fa-play text-lg"></i>
            <span id="met-toggle-text">시작</span>
        </button>
    </div>

    <!-- Right: Settings / Tap / Presets -->
    <div class="lg:col-span-5 flex flex-col gap-6">

        <!-- Time signature & sound -->
        <div class="bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-5 shadow-xl space-y-4">
            <h3 class="text-sm font-bold text-zinc-200 flex items-center gap-2">
                <i class="fa-solid fa-music text-amber-400"></i> 박자 설정
            </h3>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label for="met-beats" class="block text-xs font-semibold text-zinc-300 mb-1.5">한 마디의 박 수</label>
                    <select id="met-beats" class="w-full bg-zinc-900 border border-zinc-700 text-zinc-200 text-xs rounded-lg p-2.5 outline-none focus:border-amber-500">
                        <option value="2">2박 (2/4)</option>
                        <option value="3">3박 (3/4)</option>
                        <option value="4" selected>4박 (4/4)</option>
                        <option value="5">5박 (5/4)</option>
                        <option value="6">6박 (6/8)</option>
                        <option value="7">7박 (7/8)</option>
                    </select>
                </div>
                <div>
                    <label for="met-subdivision" class="block text-xs font-semibold text-zinc-300 mb-1.5">박 쪼개기</label>
                    <select id="met-subdivision" class="w-full bg-zinc-900 border border-zinc-700 text-zinc-200 text-xs rounded-lg p-2.5 outline-none focus:border-amber-500">
                        <option value="1" selected>♩ 4분음표</option>
                        <option value="2">♪♪ 8분음표</option>
                        <option value="3">셋잇단음표</option>
                        <option value="4">16분음표</option>
                    </select>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div>
                    <div class="text-xs font-semibold text-zinc-300">첫 박 강조 (액센트)</div>
                    <div class="text-[10px] text-zinc-500 mt-0.5">마디 첫 박을 높은 소리로 구분</div>
                </div>
                <button id="met-accent" class="px-3 py-2 rounded-lg text-xs font-bold border border-amber-500 bg-amber-500/10 text-amber-400 transition">
                    <span id="met-accent-state">켬</span>
                </button>
            </div>

            <div>
                <div class="flex justify-between text-xs text-zinc-300 font-medium mb-1">
                    <span>볼륨</span>
                    <span id="met-volume-label" class="text-amber-400 font-bold">70%</span>
                </div>
                <input type="range" id="met-volume" aria-label="메트로놈 볼륨" min="0" max="1" step="0.05" value="0.7" class="w-full accent-amber-500 h-1.5 bg-zinc-800 rounded-lg cursor-pointer">
            </div>
        </div>

        <!-- Tap tempo -->
        <div class="bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-5 shadow-xl">
            <h3 class="text-sm font-bold text-zinc-200 flex items-center gap-2 mb-1">
                <i class="fa-solid fa-hand-pointer text-amber-400"></i> 탭 템포
            </h3>
            <p class="hidden sm:block text-[11px] text-zinc-400 mb-3 leading-relaxed">
                연주하는 곡의 박에 맞춰 두드리면 템포가 따라옵니다. 재생 중에 두드리면 그 시점을 첫 박으로 삼아 박자가 재정렬됩니다.
            </p>
            <button id="met-tap" class="w-full py-7 rounded-xl bg-zinc-800 hover:bg-zinc-700 active:bg-amber-500 active:text-zinc-950 border border-zinc-700 text-zinc-100 font-black text-2xl tracking-widest transition select-none">
                TAP
            </button>
            <p id="met-tap-hint" class="text-[11px] text-zinc-500 text-center mt-2 h-4">박자에 맞춰 4번 이상 두드리세요</p>
        </div>

        <!-- Presets -->
        <div class="bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-5 shadow-xl">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-bold text-zinc-200 flex items-center gap-2">
                    <i class="fa-solid fa-star text-amber-400"></i> 즐겨찾는 템포
                </h3>
                <button id="btn-met-save-preset" class="text-[11px] text-zinc-300 hover:text-amber-400 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 px-2.5 py-1.5 rounded-lg transition font-bold">
                    <i class="fa-solid fa-plus mr-1"></i> 현재 템포 저장
                </button>
            </div>
            <div id="met-presets" class="flex flex-wrap gap-2"></div>
            <p id="met-preset-msg" class="text-[11px] text-zinc-500 mt-3 h-4"></p>
        </div>
    </div>
</div>

<!-- Shortcuts -->
<div class="hidden sm:block bg-zinc-900/40 p-4 rounded-xl border border-zinc-800/60">
    <h4 class="text-xs font-bold text-zinc-200 mb-2"><i class="fa-solid fa-keyboard text-amber-400 mr-1.5"></i>단축키</h4>
    <div class="flex flex-wrap gap-x-6 gap-y-1.5 text-[11px] text-zinc-400">
        <span><kbd class="px-1.5 py-0.5 bg-zinc-800 border border-zinc-700 rounded">Space</kbd> 시작 / 정지</span>
        <span><kbd class="px-1.5 py-0.5 bg-zinc-800 border border-zinc-700 rounded">←</kbd> <kbd class="px-1.5 py-0.5 bg-zinc-800 border border-zinc-700 rounded">→</kbd> ±1 BPM</span>
        <span><kbd class="px-1.5 py-0.5 bg-zinc-800 border border-zinc-700 rounded">Shift</kbd> + 방향키 ±10 BPM</span>
        <span><kbd class="px-1.5 py-0.5 bg-zinc-800 border border-zinc-700 rounded">T</kbd> 탭 템포</span>
    </div>
</div>
