<!-- ============ RESULT MODAL (랭크전 종료) ============ -->
<div id="result-modal" class="hidden fixed inset-0 z-[100] items-center justify-center bg-zinc-950/80 backdrop-blur p-4">
    <div class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl p-6">
        <div class="text-center mb-5">
            <div class="text-[11px] font-bold uppercase tracking-widest text-amber-400 mb-1">랭크전 종료</div>
            <div id="result-score" class="text-5xl font-black text-zinc-100 tracking-tight">0</div>
            <div class="text-xs text-zinc-500 mt-1">점</div>
        </div>

        <div class="grid grid-cols-3 gap-2 mb-4">
            <div class="text-center bg-zinc-950/80 rounded-xl border border-zinc-800 py-3">
                <div class="text-[10px] text-zinc-500 font-bold uppercase">정답</div>
                <div id="result-correct" class="text-base font-black text-emerald-400 mt-0.5">0 / 0</div>
            </div>
            <div class="text-center bg-zinc-950/80 rounded-xl border border-zinc-800 py-3">
                <div class="text-[10px] text-zinc-500 font-bold uppercase">최고 콤보</div>
                <div id="result-combo" class="text-base font-black text-amber-400 mt-0.5">0</div>
            </div>
            <div class="text-center bg-zinc-950/80 rounded-xl border border-zinc-800 py-3">
                <div class="text-[10px] text-zinc-500 font-bold uppercase">정답률</div>
                <div id="result-accuracy" class="text-base font-black text-zinc-200 mt-0.5">0%</div>
            </div>
        </div>

        <p id="result-status" class="text-[11px] text-zinc-400 text-center min-h-[18px] mb-3"></p>

        <div class="space-y-2">
            <button id="btn-submit-score" class="w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 disabled:opacity-50 disabled:cursor-not-allowed text-zinc-950 font-black text-sm transition">
                랭킹에 등록하기
            </button>
            <div class="grid grid-cols-2 gap-2">
                <button id="btn-retry" class="py-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-200 text-xs font-bold transition">
                    <i class="fa-solid fa-rotate-right mr-1"></i> 다시 하기
                </button>
                <button id="btn-close-result" class="py-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-200 text-xs font-bold transition">
                    닫기
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ============ NICKNAME MODAL ============ -->
<div id="nickname-modal" class="hidden fixed inset-0 z-[110] items-center justify-center bg-zinc-950/80 backdrop-blur p-4">
    <div class="w-full max-w-sm bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl p-6">
        <h3 class="text-base font-bold text-zinc-100 flex items-center gap-2 mb-1">
            <i class="fa-solid fa-user-pen text-amber-400"></i> 닉네임 등록
        </h3>
        <p class="text-[11px] text-zinc-400 mb-4 leading-relaxed">
            랭킹에 표시될 이름입니다. 한 번 등록하면 이 브라우저에서는 다시 묻지 않고,
            <b class="text-zinc-300">[변경]</b> 버튼을 눌렀을 때만 바뀝니다.
        </p>

        <input type="text" id="nickname-input" maxlength="12" placeholder="2~12자, 한글/영문/숫자"
               class="w-full bg-zinc-950 border border-zinc-700 text-zinc-100 text-sm rounded-lg px-3 py-2.5 outline-none focus:border-amber-500 placeholder:text-zinc-600">
        <p id="nickname-feedback" class="text-[11px] mt-2 h-4 text-zinc-500"></p>

        <div class="grid grid-cols-2 gap-2 mt-4">
            <button id="btn-nickname-save" class="py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-zinc-950 font-black text-xs transition">
                등록하기
            </button>
            <button id="btn-nickname-cancel" class="py-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-200 text-xs font-bold transition">
                취소
            </button>
        </div>
    </div>
</div>
