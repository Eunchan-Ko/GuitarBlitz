<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuitarBlitz - 일렉기타 지판 반사신경 트레이너</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- 커스텀 CSS: 공통 → 뷰별 (Tailwind 로 표현 못 하는 부분만) -->
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/trainer.css">
    <link rel="stylesheet" href="./css/metronome.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-amber-500 selection:text-zinc-950">

    <!-- Navigation Bar -->
    <header class="border-b border-zinc-800/80 bg-zinc-900/50 backdrop-blur sticky top-0 z-50 px-4 py-3">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center text-zinc-950 font-black text-xl shadow-lg shadow-amber-500/20">
                    <i class="fa-solid fa-guitar"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight flex items-center gap-2">
                        GuitarBlitz <span class="hidden sm:inline-block text-[10px] uppercase font-bold tracking-widest bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded-full">v2.5 Mic Boost</span>
                    </h1>
                    <p class="text-xs text-zinc-400 hidden sm:block">상대적 위치 계산을 파괴하는 일렉기타 지판 반사신경 트레이너</p>
                </div>
            </div>

            <!-- Header Controls -->
            <div class="flex items-center gap-2">
                <!-- Registered Player (hidden until a nickname exists) -->
                <div id="player-box" class="hidden items-center gap-2 bg-zinc-800/60 border border-zinc-700 pl-3 pr-1.5 py-1 rounded-lg">
                    <i class="fa-solid fa-user text-amber-400 text-[11px]"></i>
                    <span id="player-nickname" class="text-xs font-bold text-zinc-100 max-w-[120px] truncate"></span>
                    <button id="btn-change-nickname" class="text-[10px] text-zinc-400 hover:text-amber-400 border border-zinc-700 hover:border-amber-500/50 px-1.5 py-0.5 rounded transition">
                        변경
                    </button>
                </div>

                <button id="btn-pause" class="hidden bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 border border-zinc-700">
                    <i id="pause-icon" class="fa-solid fa-pause text-amber-400"></i>
                    <span id="pause-text" class="hidden sm:inline">일시정지</span>
                </button>
                <button id="btn-stop-header" class="hidden bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5">
                    <i class="fa-solid fa-stop"></i>
                    <span class="hidden sm:inline">훈련 정지</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Top Level Tabs -->
    <nav id="top-tabs" class="max-w-6xl w-full mx-auto px-4 pt-4">
        <div class="flex gap-1 p-1 bg-zinc-900/60 border border-zinc-800 rounded-xl">
            <button id="tab-trainer" class="flex-1 py-2.5 rounded-lg text-xs font-bold transition bg-amber-500 text-zinc-950 shadow">
                <i class="fa-solid fa-guitar mr-1.5"></i> 지판 트레이너
            </button>
            <button id="tab-metronome" class="flex-1 py-2.5 rounded-lg text-xs font-bold transition text-zinc-400 hover:text-zinc-200">
                <i class="fa-solid fa-stopwatch mr-1.5"></i> 메트로놈
            </button>
        </div>
    </nav>

    <!-- Main Content Container -->
    <!-- 각 뷰의 마크업은 html/ 아래 partial 파일에 있고 js/partials.js 가 주입합니다.
         새 뷰(탭)를 추가할 때는 partial 파일 + 컨테이너 div 한 줄만 늘리면 됩니다. -->
    <main class="max-w-6xl w-full mx-auto p-4 flex-1 flex flex-col gap-6">
        <div id="view-trainer" class="flex flex-col gap-6" data-partial="./html/view-trainer.html"></div>
        <div id="view-metronome" class="hidden flex-col gap-6" data-partial="./html/view-metronome.html"></div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-zinc-800/80 bg-zinc-950 py-4 px-4 text-center text-xs text-zinc-400">
        GuitarBlitz &copy; Electric Guitar Fretboard Reflex Trainer
    </footer>

    <!-- Modals (result / nickname) -->
    <div data-partial="./html/modals.html"></div>

    <!-- 로드 순서 주의: partials(뷰 주입) → core(설정/상태/오디오/셸 UI) → 뷰별 모듈 → backend → main.
         trainer-ui.js 는 core/ui.js 의 UI 네임스페이스를 확장하므로 반드시 그 뒤에 와야 합니다.
         main.js 는 PartialsReady 를 기다렸다가 초기화합니다. -->
    <script src="./js/core/partials.js"></script>
    <script src="./js/core/config.js"></script>
    <script src="./js/core/state.js"></script>
    <script src="./js/core/audio.js"></script>
    <script src="./js/core/ui.js"></script>
    <script src="./js/trainer/trainer-ui.js"></script>
    <script src="./js/trainer/score.js"></script>
    <script src="./js/trainer/pitch.js"></script>
    <script src="./js/trainer/fretboard.js"></script>
    <script src="./js/trainer/game.js"></script>
    <script src="./js/metronome/metronome.js"></script>
    <script src="./js/metronome/metronome-ui.js"></script>
    <script src="./js/backend/backend-config.js"></script>
    <script src="./js/backend/backend.js"></script>
    <script src="./js/backend/player.js"></script>
    <script src="./js/backend/leaderboard.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
